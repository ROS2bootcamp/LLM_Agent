# P4 place target — absolute world frame coordinates (base_link = world)
# Pick source: shelf at x=0.55, shelf surface z=0.34 m, can center z≈0.42 m
# Place target: floor-level drop zone at arm-reachable position (x=0.4, y=-0.2)
#   z=0.0 = floor surface.  plan_place() adds height/2 + surface_offset (0.001)
#   to compute can centre → 0.0 + 0.075 + 0.001 = 0.076 m (just above floor). ✓
place_target:
  x: 0.4
  y: -0.2
  z: 0.0
  roll: 0.0
  pitch: 0.0
  yaw: 0.0
