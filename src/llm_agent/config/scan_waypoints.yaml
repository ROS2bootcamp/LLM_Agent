# P1 scan waypoints — [x, y, z, roll, pitch, yaw] in world frame (base_link)
# Purpose: move arm to positions where fixed camera has clear view of shelf.
# Shelf: x≈[0.28, 0.84], y≈[-0.9, 0.9], surface z=0.34 m (after yaw=PI/2).
# Camera: fixed at x=1.2, z=0.5 facing -X — does NOT benefit from arm movement.
# Waypoints keep arm below shelf height and out of the camera's direct line of sight.
#
# All positions are within UR3 workspace (~0.5 m reach from base):
#   wp1: arm raised up and slightly back — clears camera view of shelf center
#   wp2: arm to left side — camera sees right half of shelf unobstructed
#   wp3: arm to right side — camera sees left half of shelf unobstructed
#   wp4: arm lowered forward — pre-approach height near shelf
waypoints:
  - [0.25,  0.0,  0.50, 0.0, 0.785, 0.0]
  - [0.25,  0.30, 0.42, 0.0, 0.785, 0.5]
  - [0.25, -0.30, 0.42, 0.0, 0.785, -0.5]
  - [0.40,  0.0,  0.38, 0.0, 1.047, 0.0]
